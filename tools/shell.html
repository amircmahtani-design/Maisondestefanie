<script>document.body.classList.replace('no-js','js');
/* the headline is animated in, but never at the cost of being read */
setTimeout(function(){document.querySelector('.hero')?.classList.add('ready')},1400);

/* The curtain. Run inline and early, so it is already black before the
   page paints rather than flashing the hero and then covering it.

   It plays once a visit, never for anyone who asked for less movement,
   and it lifts on a timer, on a click, on Escape, and on a hard backstop
   — four ways out, because a decorative overlay must never be the thing
   that strands somebody on a blank screen. */
(function(){
  var c = document.getElementById('curtain');
  if (!c) return;
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var seen;
  try { seen = sessionStorage.getItem('lms-curtain'); } catch(e){ seen = null; }
  if (still || seen) return;
  try { sessionStorage.setItem('lms-curtain','1'); } catch(e){}

  c.hidden = false;
  document.body.classList.add('curtained');

  var lifted = false;
  function lift(){
    if (lifted) return; lifted = true;
    c.classList.add('gone');
    document.body.classList.remove('curtained');
    setTimeout(function(){ c.remove(); }, 900);
  }
  var t = setTimeout(lift, 3300);
  var hard = setTimeout(lift, 6000);          /* if anything above fails */
  c.addEventListener('click', lift);
  addEventListener('keydown', function(e){ if (e.key === 'Escape') lift(); });
  addEventListener('pagehide', function(){ clearTimeout(t); clearTimeout(hard); lift(); });
})();

/* Every section used to live on this one page, so links and bookmarks
   point at #maison, #shelf and the rest. They now have pages of their
   own: an old anchor is carried to the page it moved to, once, before
   anything else runs. */
(function(){
  if (location.pathname !== '/' && !/\/index\.html$/.test(location.pathname)) return;
  var moved = {
    maison:'/maison.html#maison',   threads:'/maison.html#threads',
    alchemy:'/bespoke.html#alchemy', sealed:'/bespoke.html#sealed',
    bespoke:'/bespoke.html#bespoke', legacy:'/story.html#legacy',
    reviews:'/story.html#reviews',   shelf:'/creations.html#shelf',
    visit:'/visit.html#visit',       faq:'/visit.html#faq'
  };
  var to = moved[location.hash.slice(1)];
  if (to) location.replace(to + location.search);
})();

/* The language used to be settled only once content.json had landed, so a
   Greek visitor watched the page repaint. It is settled here instead,
   before anything is drawn, and the content is asked for in the same
   breath rather than waiting for the module to parse. */
(function(){
  var l;
  try{
    var q = new URLSearchParams(location.search).get('lang');
    l = (q === 'el' || q === 'en') ? q : localStorage.getItem('lms-lang');
  }catch(e){}
  if (l !== 'el' && l !== 'en')
    l = /^el/i.test(navigator.language || '') ? 'el' : 'en';
  document.documentElement.lang = l;
  document.body.classList.remove('lang-en','lang-el');
  document.body.classList.add('lang-' + l);
  try{
    window.__lmsContent = fetch('content.json',{cache:'no-cache'})
      .then(function(r){ return r.json(); });
  }catch(e){}
})();</script>
